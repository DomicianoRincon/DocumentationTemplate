<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirigiendo...</title>
    <script type="text/javascript">
      // GitHub Pages project sites are always served at
      // https://<user>.github.io/<repo>/..., so the base path is always the
      // first path segment — no per-course editing needed here.
      var segments = window.location.pathname.split('/').filter(Boolean);
      var base = segments.length ? '/' + segments[0] + '/' : '/';

      var path = window.location.pathname.replace(base, '');
      if (!path.startsWith('/')) path = '/' + path;
      var search = window.location.search;
      var hash = window.location.hash;

      window.location.replace(
        base + '?p=' + encodeURIComponent(path) +
        (search ? '&' + search.slice(1) : '') + hash
      );
    </script>
  </head>
  <body></body>
</html>
